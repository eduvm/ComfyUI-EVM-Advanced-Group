<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 470" width="100%" height="100%">
  <defs>
    <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
    <pattern id="grid30" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="url(#grid)"/>
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-opacity="0.14"/>
    </pattern>
  </defs>

  <!-- Canvas Background -->
  <rect width="1060" height="470" rx="12" fill="#141417"/>
  <rect width="1060" height="470" rx="12" fill="url(#grid30)"/>

  <!-- Floating Selection Toolbox (Above Group) -->
  <g transform="translate(355, 16)">
    <rect x="0" y="0" width="350" height="36" rx="8" fill="#18181b" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.2"/>
    <!-- Color Dot + Chevron -->
    <circle cx="20" cy="18" r="7" fill="#3f789e" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
    <path d="M 33 16 L 37 20 L 41 16" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round"/>
    <!-- Trash Icon -->
    <rect x="54" y="10" width="14" height="16" rx="2" fill="none" stroke="#a1a1aa" stroke-width="1.6"/>
    <line x1="51" y1="10" x2="71" y2="10" stroke="#a1a1aa" stroke-width="1.6"/>
    <!-- Divider -->
    <line x1="82" y1="9" x2="82" y2="27" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>
    <!-- Pills -->
    <rect x="92" y="7" width="48" height="22" rx="11" fill="#06261c" stroke="#10b981" stroke-width="1"/>
    <text x="116" y="22" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">PNG</text>

    <rect x="146" y="7" width="52" height="22" rx="11" fill="#260e3a" stroke="#a855f7" stroke-width="1"/>
    <text x="172" y="22" fill="#f3e8ff" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">Copy</text>

    <rect x="204" y="7" width="50" height="22" rx="11" fill="#051e0e" stroke="#48ff84" stroke-width="1"/>
    <text x="229" y="22" fill="#dfffe8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">Fold</text>

    <rect x="260" y="7" width="80" height="22" rx="11" fill="#082338" stroke="#38bdf8" stroke-width="1"/>
    <text x="300" y="22" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">EVM Group</text>
  </g>

  <!-- Main EVM Advanced Group Container -->
  <g transform="translate(40, 66)">
    <!-- Group Body (ComfyUI Pale Blue #3f789e @ 22% alpha) -->
    <rect x="0" y="0" width="980" height="370" rx="8" fill="#3f789e" fill-opacity="0.22" stroke="#38bdf8" stroke-width="2.2"/>

    <!-- Left Rail (GetNode) -->
    <rect x="0" y="30" width="230" height="340" fill="#000000" fill-opacity="0.16"/>
    <rect x="0" y="30" width="230" height="30" fill="#3f789e" fill-opacity="0.22"/>
    <line x1="230" y1="30" x2="230" y2="370" stroke="#3f789e" stroke-opacity="0.65" stroke-width="1.5"/>
    <line x1="0" y1="60" x2="230" y2="60" stroke="#3f789e" stroke-opacity="0.4" stroke-width="1"/>

    <!-- Left Rail Buttons -->
    <rect x="8" y="35" width="186" height="20" rx="5" fill="#3f789e" fill-opacity="0.4" stroke="#3f789e" stroke-width="1"/>
    <text x="101" y="49" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">+ Add GetNode</text>
    <rect x="198" y="35" width="24" height="20" rx="5" fill="#000000" fill-opacity="0.35" stroke="#3f789e" stroke-width="1"/>
    <text x="210" y="49" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">◀</text>

    <!-- Right Rail (SetNode) -->
    <rect x="740" y="30" width="240" height="340" fill="#000000" fill-opacity="0.16"/>
    <rect x="740" y="30" width="240" height="30" fill="#3f789e" fill-opacity="0.22"/>
    <line x1="740" y1="30" x2="740" y2="370" stroke="#3f789e" stroke-opacity="0.65" stroke-width="1.5"/>
    <line x1="740" y1="60" x2="980" y2="60" stroke="#3f789e" stroke-opacity="0.4" stroke-width="1"/>

    <!-- Right Rail Buttons -->
    <rect x="748" y="35" width="24" height="20" rx="5" fill="#000000" fill-opacity="0.35" stroke="#3f789e" stroke-width="1"/>
    <text x="760" y="49" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">▶</text>
    <rect x="776" y="35" width="196" height="20" rx="5" fill="#3f789e" fill-opacity="0.4" stroke="#3f789e" stroke-width="1"/>
    <text x="874" y="49" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">+ Add SetNode</text>

    <!-- Group Header Bar (30px = 3 grid squares) -->
    <path d="M 0 30 L 0 8 Q 0 0 8 0 L 972 0 Q 980 0 980 8 L 980 30 Z" fill="#3f789e" fill-opacity="0.82"/>
    <text x="14" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15.5" font-weight="700">2. KSampler &amp; Latent</text>

    <!-- Header Action Buttons (Run, Mute, Bypass, Fold, Count Badge) -->
    <g transform="translate(842, 6)">
      <rect x="0" y="0" width="18" height="18" rx="4" fill="#ffffff" fill-opacity="0.18"/>
      <polygon points="6,4 14,9 6,14" fill="#ffffff"/>
      <rect x="22" y="0" width="18" height="18" rx="4" fill="#ffffff" fill-opacity="0.18"/>
      <text x="31" y="13" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">M</text>
      <rect x="44" y="0" width="18" height="18" rx="4" fill="#ffffff" fill-opacity="0.18"/>
      <text x="53" y="13" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">B</text>
      <rect x="66" y="0" width="18" height="18" rx="4" fill="#ffffff" fill-opacity="0.18"/>
      <polyline points="5,11 9,6 13,11" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
      <rect x="90" y="1" width="28" height="16" rx="8" fill="#ffffff" fill-opacity="0.22"/>
      <text x="104" y="13" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">6</text>
    </g>

    <!-- 3 Grid Squares (30px) Margin Annotations -->
    <g stroke="#38bdf8" stroke-dasharray="3,3" stroke-width="1.1">
      <line x1="230" y1="150" x2="260" y2="150"/>
      <line x1="485" y1="30" x2="485" y2="60"/>
      <line x1="710" y1="150" x2="740" y2="150"/>
    </g>
    <text x="485" y="49" fill="#7dd3fc" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle">30px (3 grid squares)</text>

    <!-- Docked GetNode #1 (Expanded) -->
    <g transform="translate(30, 90)">
      <rect x="0" y="0" width="170" height="30" rx="6" fill="#2a3640" stroke="#4b5563" stroke-width="1"/>
      <text x="10" y="19" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Get_Models_MODEL</text>
      <rect x="0" y="30" width="170" height="60" rx="6" fill="#1e242b" stroke="#4b5563" stroke-width="1"/>
      <text x="130" y="48" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">MODEL ●</text>
      <rect x="10" y="56" width="150" height="22" rx="4" fill="#111827" stroke="#374151" stroke-width="1"/>
      <text x="85" y="71" fill="#f3f4f6" font-family="monospace" font-size="10.5" text-anchor="middle">Models_MODEL ▾</text>
    </g>

    <!-- Docked GetNode #2 (Collapsed / Minimized — Auto-Reflows 30px below!) -->
    <g transform="translate(30, 210)">
      <rect x="0" y="0" width="170" height="30" rx="6" fill="#2a3640" stroke="#4b5563" stroke-width="1"/>
      <circle cx="12" cy="15" r="4" fill="#9ca3af"/>
      <text x="22" y="19" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Get_Models_POSITIVE</text>
    </g>

    <!-- Docked GetNode #3 (Expanded — Moves Up Automatically when #2 is Collapsed!) -->
    <g transform="translate(30, 270)">
      <rect x="0" y="0" width="170" height="30" rx="6" fill="#2a3640" stroke="#4b5563" stroke-width="1"/>
      <text x="10" y="19" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Get_Models_NEGATIVE</text>
      <rect x="0" y="30" width="170" height="60" rx="6" fill="#1e242b" stroke="#4b5563" stroke-width="1"/>
      <rect x="10" y="56" width="150" height="22" rx="4" fill="#111827" stroke="#374151" stroke-width="1"/>
      <text x="85" y="71" fill="#f3f4f6" font-family="monospace" font-size="10.5" text-anchor="middle">Models_NEGATIVE ▾</text>
    </g>

    <!-- Central Area Nodes (Exact 30px Margin from Header & Rails) -->
    <g transform="translate(260, 60)">
      <!-- Node #ID Badge above node -->
      <rect x="0" y="-18" width="68" height="15" rx="3" fill="#18181b" stroke="#3f3f46" stroke-width="0.8"/>
      <text x="34" y="-7" fill="#a1a1aa" font-family="monospace" font-size="9.5" text-anchor="middle">#5 • 0.42s</text>

      <!-- KSampler Node -->
      <rect x="0" y="0" width="450" height="30" rx="6" fill="#27272a" stroke="#52525b" stroke-width="1.2"/>
      <text x="14" y="20" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">KSampler</text>
      <rect x="0" y="30" width="450" height="250" rx="6" fill="#18181b" stroke="#52525b" stroke-width="1.2"/>
      <text x="16" y="55" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="11">● model</text>
      <text x="16" y="75" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="11">● positive</text>
      <text x="16" y="95" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11">● negative</text>
      <text x="16" y="115" fill="#f9a8d4" font-family="system-ui, sans-serif" font-size="11">● latent_image</text>
      <text x="434" y="55" fill="#f9a8d4" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">LATENT ●</text>

      <!-- Widgets inside KSampler -->
      <rect x="16" y="135" width="418" height="24" rx="4" fill="#27272a"/>
      <text x="26" y="151" fill="#d4d4d8" font-family="monospace" font-size="11">seed: 428190412</text>
      <rect x="16" y="167" width="418" height="24" rx="4" fill="#27272a"/>
      <text x="26" y="183" fill="#d4d4d8" font-family="monospace" font-size="11">steps: 20   |   cfg: 7.0</text>
      <rect x="16" y="199" width="418" height="24" rx="4" fill="#27272a"/>
      <text x="26" y="215" fill="#d4d4d8" font-family="monospace" font-size="11">sampler_name: euler   |   scheduler: normal</text>
    </g>

    <!-- Docked SetNode (Right Rail — Auto-Named <Group>_<TYPE>) -->
    <g transform="translate(770, 90)">
      <rect x="0" y="0" width="180" height="30" rx="6" fill="#2a3640" stroke="#4b5563" stroke-width="1"/>
      <text x="10" y="19" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Set_2_KSampler_LATENT</text>
      <rect x="0" y="30" width="180" height="60" rx="6" fill="#1e242b" stroke="#4b5563" stroke-width="1"/>
      <text x="12" y="48" fill="#f9a8d4" font-family="system-ui, sans-serif" font-size="10">● LATENT</text>
      <rect x="10" y="56" width="160" height="22" rx="4" fill="#111827" stroke="#374151" stroke-width="1"/>
      <text x="90" y="71" fill="#f3f4f6" font-family="monospace" font-size="10.5" text-anchor="middle">2_KSampler_LATENT</text>
    </g>

    <!-- Wire connecting KSampler to SetNode -->
    <path d="M 702 112 C 735 112, 745 135, 775 135" fill="none" stroke="#f472b6" stroke-width="2.5"/>
  </g>
</svg>
